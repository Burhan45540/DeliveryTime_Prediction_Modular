
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Delivery Time Prediction</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg,#ff512f,#dd2476);
            display: flex;
            justify-content: center;
            align-items: center;
            padding:40px;
        }

        .container{
            width:100%;
            max-width:900px;
        }

        .card{
            background:rgba(255,255,255,.15);
            backdrop-filter: blur(20px);
            border-radius:25px;
            padding:40px;
            box-shadow:0 20px 40px rgba(0,0,0,.25);
            color:white;
        }

        .title{
            text-align:center;
            margin-bottom:10px;
            font-size:34px;
            font-weight:700;
        }

        .subtitle{
            text-align:center;
            margin-bottom:35px;
            color:#f3f3f3;
        }

        form{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .input-group{
            display:flex;
            flex-direction:column;
        }

        label{
            margin-bottom:8px;
            font-weight:500;
        }

        input,
        select{
            padding:14px;
            border:none;
            border-radius:12px;
            outline:none;
            font-size:15px;
            transition:.3s;
            background:white;
        }

        input:focus,
        select:focus{
            transform:scale(1.03);
            box-shadow:0 0 15px rgba(255,255,255,.5);
        }

        .btn{
            grid-column:1/-1;
            margin-top:15px;
            padding:16px;
            border:none;
            border-radius:50px;
            background:white;
            color:#dd2476;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            transform:translateY(-4px);
            box-shadow:0 10px 20px rgba(0,0,0,.25);
        }

        .result{
            margin-top:35px;
            background:white;
            color:#333;
            border-radius:18px;
            padding:25px;
            text-align:center;
            animation:fadeIn .6s ease;
        }

        .result h2{
            color:#dd2476;
            margin-bottom:10px;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:700px){

            .card{
                padding:25px;
            }

            .title{
                font-size:28px;
            }

        }
    </style>

</head>

<body>

<div class="container">

<div class="card">

<h1 class="title">🍔 Food Delivery Time Predictor</h1>

<p class="subtitle">
Predict delivery time instantly using Machine Learning 🚀
</p>

<form action="{{ url_for('predict_datapoint') }}" method="post">

<div class="input-group">
<label>📍 Distance (km)</label>
<input type="number" step="any" name="Distance_km" placeholder="e.g. 5.4" required>
</div>

<div class="input-group">
<label>🌦 Weather</label>
<select name="Weather" required>
<option value="">Select Weather</option>
<option value="Clear">Clear ☀</option>
<option value="Rainy">Rainy 🌧</option>
<option value="Foggy">Foggy 🌫</option>
<option value="Snowy">Snowy ❄</option>
<option value="Windy">Windy 🌪</option>
</select>
</div>

<div class="input-group">
<label>🚦 Traffic Level</label>
<select name="Traffic_Level" required>
<option value="">Select Traffic</option>
<option value="Low">Low 🟢</option>
<option value="Medium">Medium 🟡</option>
<option value="High">High 🔴</option>
</select>
</div>

<div class="input-group">
<label>🕒 Time of Day</label>
<select name="Time_of_Day" required>
<option value="">Select Time</option>
<option value="Morning">Morning 🌅</option>
<option value="Afternoon">Afternoon 🌞</option>
<option value="Evening">Evening 🌇</option>
<option value="Night">Night 🌙</option>
</select>
</div>

<div class="input-group">
<label>🛵 Vehicle Type</label>
<select name="Vehicle_Type" required>
<option value="">Select Vehicle</option>
<option value="Bike">Bike 🏍</option>
<option value="Scooter">Scooter 🛵</option>
<option value="Car">Car 🚗</option>
</select>
</div>

<div class="input-group">
<label>🍽 Preparation Time (min)</label>
<input type="number" step="any" name="Preparation_Time_min" placeholder="15" required>
</div>

<div class="input-group">
<label>👨‍🍳 Courier Experience (years)</label>
<input type="number" step="any" name="Courier_Experience_yrs" placeholder="4" required>
</div>

<button class="btn" type="submit">
🚀 Predict Delivery Time
</button>

</form>

{% if prediction_text %}

<div class="result">

<h2>🤖 Prediction Result</h2>

<h3>{{ prediction_text }}</h3>

</div>

{% endif %}

</div>

</div>

</body>

</html>
